<link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
{% assign goatcounter_code = site.analytics.goatcounter | strip %}
{% if goatcounter_code != '' and jekyll.environment == 'production' %}
<!-- GoatCounter visitor statistics (cookie-free): https://{{ goatcounter_code }}.goatcounter.com -->
<script data-goatcounter="https://{{ goatcounter_code }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script>
  /* Also count downloads of files under /files/ (CV, patent, abstracts, movie) as events. */
  document.addEventListener('click', function (event) {
    var link = event.target.closest && event.target.closest('a[href*="/files/"]');
    if (!link || !window.goatcounter || !window.goatcounter.count) return;
    var file = link.pathname.split('/').pop();
    window.goatcounter.count({ path: 'download-' + file, title: 'Download: ' + file, event: true });
  });
</script>
{% endif %}
