---
layout: default
---
<main id="main" class="{% if page.home %}home-content{% else %}interior-page{% endif %}" tabindex="-1">
  {% unless page.home %}
  <header class="page-banner">
    <div class="page-banner-inner">
      <p class="eyebrow">{{ page.eyebrow | default: 'Jinhyung Lee' }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.intro %}<p class="section-intro">{{ page.intro }}</p>{% endif %}
    </div>
  </header>
  {% endunless %}
  {% if page.home %}{{ content }}{% else %}<div class="main-content">{{ content }}</div>{% endif %}
</main>
